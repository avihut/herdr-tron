[tools]
node = "24"
pnpm = "12.18.0"

[tasks.test]
run = "pnpm test"
[tasks.check]
run = "pnpm run check"
[tasks.preview]
run = "pnpm run preview"
[tasks.install]
depends = ["test", "check"]
run = "pnpm run install:layout"
[tasks.update]
depends = ["test", "check"]
run = "pnpm run install:layout --update"

[tasks.build]
run = ["node scripts/setup.js", "pnpm run preview"]
